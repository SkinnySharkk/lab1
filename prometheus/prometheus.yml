global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'load-balancer-metrics'
    static_configs:
      - targets: ['proxy:8405']

  - job_name: 'load-nginx-metrics'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'load-mariadb-metrics'
    static_configs:
      - targets: ['mysql-exporter:9104']
  - job_name: 'load-node-metrics'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'load-redis-metrics'
    static_configs:
    - targets: ['redis-exporter:9121']
