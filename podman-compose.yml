services:
  db:
    image: docker.io/library/mariadb:10.11
    env_file: .env
    networks:
      - backend-net
    volumes:
      db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:7-alpine
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  php-fpm:
    image: localhost/my-custom-php:8.3-fpm
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
    networks:
      - backend-net
    volumes:
      - ./web-site:/var/www/html:ro,Z
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web1:
    image: docker.io/library/nginx:1.26-alpine
    networks:
      - frontend-net
      - backend-net
    volumes:
      - ./nginx:/etc/nginx/conf.d/:ro,Z
      - ./web-site:/var/www/html:ro,z
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web2:
    image: docker.io/library/nginx:1.26-alpine
    networks:
      - frontend-net
      - backend-net
    volumes:
      - ./nginx:/etc/nginx/conf.d/:ro,Z
      - ./web-site:/var/www/html:ro,z
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  proxy:
    image: docker.io/library/haproxy:3.4-alpine
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8404:8404"
    networks:
      - frontend-net
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro,Z
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-c"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: docker.io/prom/prometheus:v3.13.1
    ports:
      - "9090:9090"
    networks:
      - backend-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus

  grafana:
    image: docker.io/grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    networks:
      - backend-net
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana_data:/var/lib/grafana   
    env_file: .env   

  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - backend-net
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  haproxy-exporter:
    image: docker.io/prom/haproxy-exporter:latest
    container_name: haproxy-exporter
    ports:
      - "9101:9101"
    env_file: .env
    networks:
      - backend-net
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    ports:
      - "9113:9113"
    env_file: .env
    networks:
      - backend-net
    restart: unless-stopped

  mysqld-exporter:
    image: docker.io/prom/mysqld-exporter:v0.19.0
    container_name: mysqld-exporter
    ports:
      - "9104:9104"
    env_file: .env
    networks:
      - backend-net
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.82.0
    container_name: redis-exporter
    ports:
      - "9121:9121"
    env_file: .env
    networks:
      - backend-net
    restart: unless-stopped

  php-fpm-exporter:
    image: docker.io/hipages/php-fpm_exporter:latest
    container_name: php-fpm-exporter
    ports:
      - "9253:9253"
    env_file: .env
    networks:
      - backend-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data: